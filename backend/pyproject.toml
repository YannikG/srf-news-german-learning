[project]
name = "srf-news-backend"
version = "0.0.0"
description = "Flask backend for SRF News German Learning (not published to PyPI)"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that bind a local TCP port (threaded dev server); deselect with -m 'not integration'",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "venv", ".tmp-venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "RET", "S"]
# S105: false positives on OAuth URLs and header constant names. S608: SQLAlchemy ``text()``
# with static fragments plus bound parameters still triggers bandit; review at call sites.
ignore = ["S105", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S113"]

[tool.ruff.format]
quote-style = "double"
