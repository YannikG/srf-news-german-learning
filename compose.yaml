# Stack from repository root: `docker compose up` / `docker compose up -d`
# See README.md, docs/roadmap/phase-1/README.md, docs/sidecar-api.md

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Single directory mount: SQLite expects files under /data, not named volumes on file paths.
      - app_data:/data
    environment:
      SIDECAR_BASE_URL: http://sidecar:8090
      SIDECAR_SHARED_SECRET: ${SIDECAR_SHARED_SECRET:-dev-sidecar-secret}
    depends_on:
      - ollama
      - sidecar

  ollama:
    image: ollama/ollama:0.23.2
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    volumes:
      # rw bind: matches Docker API expectations for start/stop (see PR review on :ro).
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SIDECAR_SHARED_SECRET: ${SIDECAR_SHARED_SECRET:-dev-sidecar-secret}
      DOCKER_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-}
    restart: unless-stopped

volumes:
  app_data:
  ollama_data:
