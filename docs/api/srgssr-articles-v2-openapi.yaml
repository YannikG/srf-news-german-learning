      type: string
    Link:
      required:
      - locator
      - type
      type: object
      properties:
        name:
          description: The name of the link.
          type: string
          nullable: true
        locator:
          description: The permanent URI of the link.
          type: object
          allOf:
          - $ref: "#/components/schemas/URI"
        type:
          description: The type of the resource. Always 'Link'
          type: string
    
    GeoBlockingLocation:
      description: The location to which the content is restricted (e.g. 'Switzerland').
      required:
      - sourceValue
      type: object
      properties:
        sourceValue:
          type: string
          
    Occupation:
      required:
      - name
      type: object
      properties:
        name:
          type: array
          items:
            $ref: "#/components/schemas/Text"
          
    Person:
      required:
      - identifiers
      - type
      type: object
      properties:
        name:
          type: string
          writeOnly: true
        identifiers:
          description: The alternative identifiers of the person.
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
        occupations:
          description: The role(s) the person takes in relation to the asset.
          type: array
          items:
            $ref: "#/components/schemas/Occupation"
          nullable: true
        alias:
          type: array
          items:
            type: string
          nullable: true
        type:
          description: The type of the agent. Always 'Person'
          type: string
    
    Picture:
      required:
      - locator
      - type
      type: object
      properties:
        name:
          description: The name of the picture. This can be a filename or a title.
          type: array
          items:
            $ref: "#/components/schemas/Text"
          nullable: true
        description:
          description: The description of the picture. This can be a caption or alternative
